[window]
decorations = "none"
padding = { x = 4, y = 4 }
opacity = 0.95

[font]
size = 11

[font.normal]
family = "DejaVu Sans Mono"

[font.bold]
family = "DejaVu Sans Mono"

[font.italic]
family = "DejaVu Sans Mono"

[font.bold_italic]
family = "DejaVu Sans Mono"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"
